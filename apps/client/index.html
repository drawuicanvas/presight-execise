<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="theme-color" content="#131118" />

        <!-- Fetch both Archivo faces up front instead of waiting for the CSS to reveal them.
             `crossorigin` is required even same-origin: fonts fetch in CORS mode, and without it
             the preload is cached separately and the file downloads twice. -->

        <link
            rel="preload"
            href="/fonts/Archivo-VariableFont_wdth,wght.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/Archivo-Italic-VariableFont_wdth,wght.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />

        <title>Presight · User Search</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
